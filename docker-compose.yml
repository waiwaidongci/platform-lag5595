name: platform-lag-gb0052
x-runtime: &runtime
  DATABASE_URL: 'mysql+pymysql://analytics:${DB_PASSWORD:-analytics-demo-2611}@db:3306/analytics'
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-demo-platform-lag-gb0052-signing-2611-only}
  SEED_DEMO: ${SEED_DEMO:-true}
  ARTIFACT_DIR: /artifacts
services:
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-platform-lag-gb0052}-frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-18271}:80'
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    image: platform-lag-gb0052-runtime:local
    container_name: ${COMPOSE_PROJECT_NAME:-platform-lag-gb0052}-backend
    environment: *runtime
    volumes: [artifacts:/artifacts]
    ports:
      - '127.0.0.1:${BACKEND_PORT:-19271}:8000'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz")']
      interval: 3s
      timeout: 3s
      retries: 35
  worker:
    image: platform-lag-gb0052-runtime:local
    pull_policy: never
    container_name: ${COMPOSE_PROJECT_NAME:-platform-lag-gb0052}-worker
    command: [python, -m, src.worker]
    environment: *runtime
    volumes: [artifacts:/artifacts]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'from pathlib import Path; import time; assert time.time()-Path("/tmp/analysis-heartbeat").stat().st_mtime < 30']
      interval: 3s
      timeout: 3s
      retries: 20
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-platform-lag-gb0052}-db
    environment:
      MYSQL_DATABASE: analytics
      MYSQL_USER: analytics
      MYSQL_PASSWORD: ${DB_PASSWORD:-analytics-demo-2611}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-demo-local-2611}
    ports:
      - '127.0.0.1:${DB_PORT:-17771}:3306'
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysql -h 127.0.0.1 -u analytics -p"$$MYSQL_PASSWORD" analytics -e "SELECT 1"']
      interval: 3s
      timeout: 4s
      retries: 45
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-platform-lag-gb0052}-redis
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 25
volumes:
  db-data: {}
  redis-data: {}
  artifacts: {}
networks:
  default:
    ipam:
      config:
        - subnet: ${APP_SUBNET:-10.253.71.0/28}
